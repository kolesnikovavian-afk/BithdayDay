<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Генератор QR — Зелёный Биом</title>
<style>
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #f5f5f0;
    color: #1a2e1a;
    margin: 0;
    padding: 24px 16px;
    line-height: 1.5;
  }
  .container { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 6px; color: #2d5a2d; }
  .sub { color: #5a6b5a; font-size: 14px; margin: 0 0 24px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 18px;
  }
  .item {
    background: #fff;
    border: 2px solid #d4e6d4;
    border-radius: 12px;
    padding: 16px;
    text-align: center;
    page-break-inside: avoid;
  }
  .item .code {
    font-family: 'Courier New', monospace;
    font-size: 14px;
    font-weight: 700;
    color: #2d7a2d;
    letter-spacing: 1px;
    margin-bottom: 6px;
    word-break: break-all;
  }
  .item .desc {
    font-size: 12px;
    color: #5a6b5a;
    margin-bottom: 12px;
    min-height: 32px;
  }
  .qr-box {
    width: 180px;
    height: 180px;
    margin: 0 auto;
    background: #fff;
    border-radius: 6px;
    padding: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .qr-box img, .qr-box canvas, .qr-box svg { max-width: 100%; max-height: 100%; }
  @media print {
    body { padding: 0; background: #fff; }
    .item { box-shadow: none; }
    button { display: none; }
  }
  .top-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .top-bar button {
    background: #2d7a2d;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 14px;
    cursor: pointer;
    font-weight: 600;
  }
  .top-bar button:hover { background: #1e5c1e; }
</style>
</head>
<body>
<div class="container">

  <h1>🔳 Генератор QR-кодов</h1>
  <p class="sub">Все QR для квеста. Каждый уже содержит нужный текст. Распечатай и разрежь.</p>

  <div class="top-bar">
    <button onclick="window.print()">🖨 Распечатать всё</button>
    <button onclick="location.reload()">🔄 Обновить</button>
  </div>

  <div class="grid" id="grid"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
const CODES = [
  { code: 'START',          desc: 'Старт (если понадобится)' },
  { code: 'BATH_MUSIC',     desc: 'Дверь ванной → BAZA' },
  { code: 'BATH_DANCE',     desc: 'Дно таза → таймер танца' },
  { code: 'KITCHEN_MUSIC',  desc: 'Дверь кухни → Sweden' },
  { code: 'KITCHEN_RECIPE', desc: 'Стол / рецепт → медовуха' },
  { code: 'OFFICE_MUSIC',   desc: 'Дверь офиса → Aria Math' },
  { code: 'OFFICE_HINT',    desc: 'Домик Марса → изумруд' },
  { code: 'FINAL',          desc: 'Финал (если понадобится)' }
];

const grid = document.getElementById('grid');

CODES.forEach(({ code, desc }) => {
  const qr = qrcode(0, 'M');
  qr.addData(code);
  qr.make();
  const img = qr.createImgTag(6, 8);

  const div = document.createElement('div');
  div.className = 'item';
  div.innerHTML = `
    <div class="code">${code}</div>
    <div class="desc">${desc}</div>
    <div class="qr-box">${img}</div>
  `;
  grid.appendChild(div);
});
</script>
</body>
</html>
