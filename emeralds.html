<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Изумруды — для печати</title>
<style>
  @page { size: A4; margin: 12mm; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Courier New', monospace;
    background: #f5f5f0;
    color: #1a2e1a;
    padding: 10px;
  }
  .title {
    text-align: center;
    font-size: 15px;
    margin-bottom: 4px;
    color: #2d7a2d;
    letter-spacing: 2px;
  }
  .subtitle {
    text-align: center;
    font-size: 10px;
    color: #4a6b4a;
    margin-bottom: 8mm;
    font-style: italic;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 6mm;
    justify-items: center;
    align-items: center;
    margin: 0 auto;
    max-width: 175mm;
  }
  .emerald {
    width: 78mm;
    height: 88mm;
    background: linear-gradient(150deg, #5DDF7F 0%, #3EBE63 40%, #2d8a4a 75%, #1a5f30 100%);
    border: 3.5px solid #145228;
    border-radius: 14px;
    box-shadow:
      inset 0 -10px 16px rgba(0,0,0,0.25),
      inset 0 10px 16px rgba(255,255,255,0.35),
      0 2px 6px rgba(0,0,0,0.15);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: #fff;
    position: relative;
    padding: 4mm;
    page-break-inside: avoid;
  }
  .emerald::before {
    content: '';
    position: absolute;
    top: 7px; left: 7px; right: 7px; bottom: 7px;
    border-radius: 10px;
    border: 2px dashed rgba(255,255,255,0.5);
    pointer-events: none;
  }
  .emerald::after {
    content: '';
    position: absolute;
    top: 12%;
    left: 16%;
    width: 32%;
    height: 15%;
    background: radial-gradient(ellipse, rgba(255,255,255,0.75) 0%, rgba(255,255,255,0) 70%);
    border-radius: 50%;
    transform: rotate(-25deg);
    pointer-events: none;
  }
  .number {
    font-size: 78pt;
    font-weight: 900;
    line-height: 1;
    text-shadow: 0 3px 0 #145228, 0 0 14px rgba(255,255,255,0.5);
    margin-bottom: 2mm;
    z-index: 1;
  }
  .letter {
    font-size: 52pt;
    font-weight: 900;
    line-height: 1;
    text-shadow: 0 3px 0 #145228, 0 0 12px rgba(255,255,255,0.4);
    z-index: 1;
  }
  .footer {
    text-align: center;
    font-size: 10px;
    color: #4a6b4a;
    margin-top: 8mm;
    font-style: italic;
    line-height: 1.5;
  }
  @media print {
    body { background: #fff; padding: 0; }
    .emerald {
      box-shadow:
        inset 0 -10px 16px rgba(0,0,0,0.25),
        inset 0 10px 16px rgba(255,255,255,0.35);
    }
  }
</style>
</head>
<body>

<div class="title">💎 ЗЕЛЁНЫЙ БИОМ · ИЗУМРУДЫ 💎</div>
<div class="subtitle">Распечатай, вырежи по границам. Все 4 изумруда на одной странице.</div>

<div class="grid">
  <div class="emerald"><div class="number">2</div><div class="letter">П</div></div>
  <div class="emerald"><div class="number">5</div><div class="letter">О</div></div>
  <div class="emerald"><div class="number">1</div><div class="letter">Р</div></div>
  <div class="emerald"><div class="number">0</div><div class="letter">А</div></div>
</div>

<div class="footer">
  2 · 5 · 1 · 0 = 25.10 — дата<br>
  П · О · Р · А — собери и прочитай
</div>

</body>
</html>
